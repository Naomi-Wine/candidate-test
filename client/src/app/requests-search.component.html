<form [formGroup]="form">
  <mat-form-field>
    <mat-label>Request number</mat-label>
    <input matInput formControlName="requestNumber" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Status</mat-label>
    <mat-select formControlName="status" multiple>
      @for (status of statuses; track status) {
        <mat-option [value]="status">{{ status }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Type</mat-label>
    <mat-select formControlName="requestType">
      <mat-option [value]="null">Any</mat-option>
      @for (type of types; track type) {
        <mat-option [value]="type">{{ type }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <!-- Two separate pickers rather than mat-date-range-input, so the controls map
       one-to-one onto the contract's fromDate and toDate. -->
  <mat-form-field>
    <mat-label>From</mat-label>
    <input matInput [matDatepicker]="fromPicker" formControlName="fromDate" />
    <mat-datepicker-toggle matIconSuffix [for]="fromPicker" />
    <mat-datepicker #fromPicker />
  </mat-form-field>

  <mat-form-field>
    <mat-label>To</mat-label>
    <input matInput [matDatepicker]="toPicker" formControlName="toDate" />
    <mat-datepicker-toggle matIconSuffix [for]="toPicker" />
    <mat-datepicker #toPicker />
  </mat-form-field>

  <button mat-button type="button" (click)="reset()">Reset</button>
</form>

<!-- async pipe, so there is no manual subscribe and no manual unsubscribe. -->
@if (result$ | async; as result) {
  <!-- Plain array as the data source. Binding a MatTableDataSource and attaching a sort
       or paginator to it would sort and page this page's rows in memory — see CLAUDE.md §6. -->
  <table mat-table [dataSource]="result.items">
    <ng-container matColumnDef="requestNumber">
      <th mat-header-cell *matHeaderCellDef>Request number</th>
      <td mat-cell *matCellDef="let request">{{ request.requestNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let request">{{ request.status }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
