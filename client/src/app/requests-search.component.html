<!-- async pipe, so there is no manual subscribe and no manual unsubscribe. -->
@if (result$ | async; as result) {
  <!-- Plain array as the data source. Binding a MatTableDataSource and attaching a sort
       or paginator to it would sort and page this page's rows in memory — see CLAUDE.md §6. -->
  <table mat-table [dataSource]="result.items">
    <ng-container matColumnDef="requestNumber">
      <th mat-header-cell *matHeaderCellDef>Request number</th>
      <td mat-cell *matCellDef="let request">{{ request.requestNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let request">{{ request.status }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
